<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L08 — Memory Match vs Bot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cabinet">
    <header class="marquee">
      <h1>MEMORY&nbsp;MATCH</h1>
      <p class="subtitle">DUEL THE BOT &middot; 记忆配对 vs 电脑</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score player"><span class="tag">PLAYER&nbsp;MATCHES</span><span id="playerScore" class="num">0</span></div>
      <div class="score pairs"><span class="tag">PAIRS&nbsp;LEFT</span><span id="pairsLeft" class="num">8</span></div>
      <div class="score bot"><span class="tag">BOT&nbsp;MATCHES</span><span id="botScore" class="num">0</span></div>
    </section>

    <main class="arena">
      <div id="status" class="status">PLAYER TURN — 翻开两张卡配对</div>

      <div id="grid" class="grid" aria-label="Memory card grid"></div>

      <button id="resetBtn" class="btn reset">NEW GAME / 重新开始</button>
    </main>

    <div id="winnerOverlay" class="overlay hidden">
      <div class="result-card">
        <div id="resultIcon" class="result-icon"></div>
        <div id="resultTitle" class="result-title"></div>
        <div id="resultDetail" class="result-detail"></div>
        <button id="resultReset" class="btn reset">PLAY AGAIN / 再来一局</button>
      </div>
    </div>

    <footer class="byline">HS COMPUTER SCIENCE · L08 · 姓名/Class: ____________</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
