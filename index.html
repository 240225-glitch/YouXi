<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L09 — Typing Speed Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cabinet">
    <header class="marquee">
      <h1>TYPING&nbsp;DUEL</h1>
      <p class="subtitle">BEAT THE BOT &middot; 打字对决 vs 电脑</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score player"><span class="tag">WPM</span><span id="wpmBox" class="num">0</span></div>
      <div class="score time"><span class="tag">TIME</span><span id="timeBox" class="num">0.0</span></div>
      <div class="score acc"><span class="tag">ACCURACY</span><span id="accBox" class="num">--</span></div>
      <div class="score bot"><span class="tag">BOT&nbsp;WPM</span><span id="botBox" class="num">--</span></div>
    </section>

    <main class="arena">
      <div id="status" class="status idle">PRESS START — 按开始后照着提示打字</div>

      <div id="prompt" class="prompt" aria-label="Prompt sentence"></div>

      <textarea id="typeInput" class="typebox" rows="3" spellcheck="false"
        placeholder="Press START first… / 先按开始按钮" disabled></textarea>

      <div class="controls">
        <button id="startBtn" class="btn start">START / 开始</button>
        <button id="finishBtn" class="btn finish">FINISH / 提交</button>
        <button id="resetBtn" class="btn reset">NEW PROMPT / 换题</button>
      </div>
    </main>

    <div id="resultOverlay" class="overlay hidden">
      <div class="result-card">
        <div id="resultIcon" class="result-icon"></div>
        <div id="resultTitle" class="result-title"></div>
        <div id="resultDetail" class="result-detail"></div>
        <button id="resultReset" class="btn reset">PLAY AGAIN / 再来一局</button>
      </div>
    </div>

    <footer class="byline">HS COMPUTER SCIENCE · L09 · 姓名/Class: ____________</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
