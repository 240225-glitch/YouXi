<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L05 — Guess the Number Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cabinet">
    <header class="marquee">
      <h1>GUESS&nbsp;THE&nbsp;NUMBER</h1>
      <p class="subtitle">DUEL VERSUS THE MACHINE · 人与电脑猜数对决</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score wins"><span class="tag">PLAYER WINS</span><span id="playerWin" class="num">0</span></div>
      <div class="score losses"><span class="tag">BOT WINS</span><span id="botWin" class="num">0</span></div>
    </section>

    <main class="arena">
      <div class="secret-panel">
        <span class="label">SECRET NUMBER (1–50)</span>
        <div id="secretDisplay" class="secret-num">?</div>
      </div>

      <div class="input-row">
        <input id="guessInput" type="number" min="1" max="50" placeholder="Enter 1–50" />
        <button id="guessBtn" class="btn guess">GUESS</button>
      </div>

      <div id="moodBox" class="mood">
        <span id="moodIcon" class="mood-icon">🤖</span>
        <span id="moodText">I have chosen a number. Try to guess it!</span>
      </div>

      <div id="clueBox" class="clue" aria-live="polite">
        <span id="clueText" class="clue-text">Enter your first guess above</span>
      </div>

      <div class="stats-row">
        <div class="stat"><span class="tag">ATTEMPTS</span><span id="attempts" class="num attempts-num">0 / 7</span></div>
        <div class="stat"><span class="tag">REMAINING</span><span id="remaining" class="num remaining-num">7</span></div>
      </div>

      <button id="resetBtn" class="btn reset">NEW GAME / 重新开始</button>
    </main>

    <div id="resultOverlay" class="overlay hidden">
      <div class="result-card">
        <div id="resultIcon" class="result-icon"></div>
        <div id="resultTitle" class="result-title"></div>
        <div id="resultDetail" class="result-detail"></div>
        <button id="resultReset" class="btn reset">PLAY AGAIN / 再来一局</button>
      </div>
    </div>

    <footer class="byline">HS COMPUTER SCIENCE · L05 · 姓名/Class: ____________</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
