<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Mini Adventure</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-card">
    <section class="hud">
      <div>
        <p class="eyebrow">Unit 2 Project</p>
        <h1>Neon Mini Adventure</h1>
      </div>
      <p class="mission">Guide the explorer through the cyber ruins.</p>
    </section>

    <section class="game-world" id="gameWorld">
      <div class="goal">CORE</div>
      <div class="obstacle block-one"></div>
      <div class="obstacle block-two"></div>
      <div class="obstacle block-three"></div>
      <div class="hero" id="hero"></div>
    </section>

    <section class="controls">
      <p><strong>Move:</strong> WASD or arrow keys</p>
      <p>Today: movement only. Next lesson: coins, walls and winning.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
